<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F4F1EA">
<title>나의 업무 도구 모음</title>
<style>
  /* =========================================================
     색상·글꼴 (공통 디자인: 오트밀 배경 + 남색 포인트)
     외부 파일 없이 쓰기 위해 글꼴은 컴퓨터에 설치된 것을 차례로 사용
     ========================================================= */
  :root {
    --bg: #F4F1EA;          /* 배경: 오트밀 아이보리 */
    --surface: #FCFAF5;     /* 카드 바탕: 크림색 */
    --soft: #EFEBE2;        /* 입력칸·칩 바탕 */
    --ink: #2B2F38;         /* 본문 글자 */
    --muted: #7A7468;       /* 보조 글자 */
    --line: #E2DCCF;        /* 테두리 */
    --navy: #1f3a6d;        /* 포인트 색 (남색) */
    --navy-dark: #172D55;
    --navy-soft: #E3E6EC;
    --mustard: #D9B26A;     /* 준비 중 배지 */
    --shadow: rgba(70, 58, 38, .07);
    --shadow-up: rgba(70, 58, 38, .14);
    --font: "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", "맑은 고딕", sans-serif;
    color-scheme: light;
  }

  *, *::before, *::after { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh;
    background: var(--bg); color: var(--ink);
    font-family: var(--font); line-height: 1.55;
    display: flex; flex-direction: column;
  }
  :focus-visible { outline: 3px solid rgba(31, 58, 109, .35); outline-offset: 2px; }
  .wrap { max-width: 1100px; width: 100%; margin: 0 auto; padding: 0 24px; }

  /* ===== 위쪽: 제목·부제·검색 ===== */
  .hero { padding: calc(56px + env(safe-area-inset-top, 0px)) 0 32px; text-align: center; }
  .hero h1 {
    margin: 0; font-size: clamp(1.9rem, 5vw, 2.8rem); font-weight: 900;
    color: var(--navy); letter-spacing: -0.03em; line-height: 1.2;
  }
  .hero p { margin: 10px 0 0; font-size: 1.05rem; color: var(--muted); }

  .search {
    position: relative; max-width: 520px; margin: 28px auto 0;
  }
  .search svg {
    position: absolute; left: 18px; top: 50%; transform: translateY(-50%);
    width: 20px; height: 20px; color: var(--muted); pointer-events: none;
  }
  .search input {
    width: 100%; font: inherit; font-size: 1rem; color: var(--ink);
    padding: 14px 18px 14px 50px; border-radius: 999px;
    border: 1.5px solid var(--line); background: var(--surface);
    box-shadow: 0 4px 16px var(--shadow); transition: border-color .15s;
  }
  .search input::placeholder { color: #A39C8F; }
  .search input:focus { outline: none; border-color: var(--navy); }
  .result-info { margin: 12px 0 0; font-size: .85rem; color: var(--muted); min-height: 1.3em; }

  /* ===== 가운데: 도구 카드 격자 ===== */
  main { flex: 1; padding-bottom: 48px; }
  .grid {
    display: grid; gap: 20px;
    grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
  }
  .card {
    position: relative; display: flex; flex-direction: column;
    background: var(--surface); border: 1px solid var(--line); border-radius: 22px;
    padding: 26px 22px 22px; box-shadow: 0 4px 18px var(--shadow);
    transition: transform .2s ease, box-shadow .2s ease;
  }
  /* 마우스를 올리면 살짝 떠오름 */
  .card:hover { transform: translateY(-6px); box-shadow: 0 14px 30px var(--shadow-up); }
  .card.is-wait { background: #F8F5EE; }

  .emoji {
    width: 72px; height: 72px; border-radius: 20px; background: var(--soft);
    display: grid; place-items: center; font-size: 2.6rem; line-height: 1; margin-bottom: 16px;
  }
  .card h2 { margin: 0; font-size: 1.15rem; font-weight: 700; color: var(--navy); }
  .card p { margin: 6px 0 20px; font-size: .92rem; color: var(--muted); flex: 1; }

  .badge {
    position: absolute; top: 18px; right: 18px;
    font-size: .75rem; font-weight: 700; color: #6B5320;
    background: #F2E4C3; border: 1px solid var(--mustard);
    padding: 2px 10px; border-radius: 999px;
  }

  .open {
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    font: inherit; font-weight: 700; font-size: .95rem; text-decoration: none;
    padding: .7em 1em; border-radius: 14px;
    background: var(--navy); color: #fff; border: 1.5px solid var(--navy);
    transition: background-color .15s;
  }
  .open:hover { background: var(--navy-dark); }
  /* 준비 중인 도구의 버튼 */
  .open.disabled {
    background: var(--soft); color: #A39C8F; border-color: var(--line); cursor: not-allowed;
  }

  .empty {
    grid-column: 1 / -1; text-align: center; color: var(--muted);
    padding: 48px 0; font-size: 1rem;
  }

  /* ===== 맨 아래 ===== */
  footer {
    border-top: 1px solid var(--line); text-align: center;
    padding: 18px 0 calc(22px + env(safe-area-inset-bottom, 0px));
    font-size: .82rem; color: var(--muted);
  }

  /* ===== 휴대폰: 한 줄에 카드 하나 ===== */
  @media (max-width: 600px) {
    .wrap { padding: 0 16px; }
    .hero { padding-top: calc(40px + env(safe-area-inset-top, 0px)); padding-bottom: 24px; }
    .grid { grid-template-columns: 1fr; gap: 14px; }
    .card { padding: 22px 18px 18px; }
  }
  /* 움직임 줄이기를 설정한 사용자는 떠오르는 효과 끔 */
  @media (prefers-reduced-motion: reduce) {
    .card, .card:hover { transition: none; transform: none; }
  }
</style>
</head>
<body>

  <!-- 위쪽: 제목, 부제, 검색창 -->
  <header class="wrap hero">
    <h1>나의 업무 도구 모음</h1>
    <p>바이브 코딩으로 직접 만든 업무 도우미</p>
    <div class="search">
      <!-- 돋보기 아이콘 (그림 파일 없이 SVG로 직접 그림) -->
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true">
        <circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path>
      </svg>
      <input type="search" id="search" placeholder="도구 이름이나 설명으로 찾기" autocomplete="off" aria-label="도구 검색">
    </div>
    <p class="result-info" id="resultInfo" aria-live="polite"></p>
  </header>

  <!-- 가운데: 도구 카드가 들어갈 자리 -->
  <main class="wrap">
    <div class="grid" id="grid"></div>
  </main>

  <!-- 맨 아래: 만든 사람 -->
  <footer class="wrap" id="footer"></footer>

<script>
  /* =========================================================
     설정값: 여기만 고치면 됩니다
     ========================================================= */

  // 맨 아래에 표시할 만든 사람 이름
  const AUTHOR = '○○○';
  const FOOTER_SUFFIX = '2026 바이브 코딩 실습';

  // 도구 목록: 한 줄 추가하면 카드가 하나 생깁니다.
  // ready: false 이면 "준비 중" 배지가 붙고 [열기] 버튼이 잠깁니다.
  const TOOLS = [
    { emoji: '🍱', name: '점심 메뉴 룰렛',     desc: '오늘 점심을 대신 정해 드려요',             url: 'lunch.html',     ready: true  },
    { emoji: '📄', name: 'PDF 병합·분할기',    desc: '여러 PDF를 합치고 나눠요',                 url: 'pdf-tool.html',  ready: true  },
    { emoji: '📊', name: '자동 데이터 분석기', desc: '파일만 넣으면 분석하고 차트를 추천해요',   url: 'analyzer.html',  ready: true },
    { emoji: '⚡', name: '전력수요 대시보드',  desc: '공공데이터로 본 우리나라 전력 사용',       url: 'dashboard.html', ready: false },
  ];

  /* =========================================================
     카드 그리기
     ========================================================= */
  const grid = document.getElementById('grid');
  const searchInput = document.getElementById('search');
  const resultInfo = document.getElementById('resultInfo');

  // 도구 하나로 카드 하나 만들기 (글자는 textContent로 넣어 안전하게)
  function makeCard(tool) {
    const card = document.createElement('article');
    card.className = 'card' + (tool.ready ? '' : ' is-wait');

    if (!tool.ready) {
      const badge = document.createElement('span');
      badge.className = 'badge';
      badge.textContent = '준비 중';
      card.append(badge);
    }

    const emoji = document.createElement('div');
    emoji.className = 'emoji';
    emoji.setAttribute('aria-hidden', 'true');
    emoji.textContent = tool.emoji;

    const title = document.createElement('h2');
    title.textContent = tool.name;

    const desc = document.createElement('p');
    desc.textContent = tool.desc;

    // 준비된 도구는 링크, 준비 중인 도구는 잠긴 버튼
    let btn;
    if (tool.ready) {
      btn = document.createElement('a');
      btn.className = 'open';
      btn.href = tool.url;
      btn.textContent = '열기 →';
      btn.setAttribute('aria-label', `${tool.name} 열기`);
    } else {
      btn = document.createElement('button');
      btn.className = 'open disabled';
      btn.type = 'button';
      btn.disabled = true;
      btn.textContent = '준비 중이에요';
    }

    card.append(emoji, title, desc, btn);
    return card;
  }

  // 검색어에 맞는 도구만 화면에 그리기
  function render() {
    const q = searchInput.value.trim().toLowerCase();
    const list = q
      ? TOOLS.filter((t) => (t.name + ' ' + t.desc).toLowerCase().includes(q))
      : TOOLS;

    grid.innerHTML = '';
    list.forEach((t) => grid.append(makeCard(t)));

    if (list.length === 0) {
      const empty = document.createElement('p');
      empty.className = 'empty';
      empty.textContent = `"${searchInput.value.trim()}"에 맞는 도구가 없어요.`;
      grid.append(empty);
    }

    // 검색 중일 때만 결과 개수 안내
    resultInfo.textContent = q ? `${list.length}개의 도구를 찾았어요.` : `도구 ${TOOLS.length}개`;
  }

  searchInput.addEventListener('input', render);
  // Esc 키로 검색어 지우기
  searchInput.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') { searchInput.value = ''; render(); }
  });

  // 맨 아래 문구
  document.getElementById('footer').textContent = `만든 사람: ${AUTHOR} · ${FOOTER_SUFFIX}`;

  // 처음 화면 그리기
  render();
</script>
</body>
</html>
